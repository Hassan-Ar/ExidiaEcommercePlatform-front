<div class="card">
  <div class="card-header">
    <h2>{{ isEditMode ? 'Edit Category' : 'Create Category' }}</h2>
  </div>
  <div class="card-body">
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="needs-validation" novalidate>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="name" class="form-label">Name *</label>
          <input
            type="text"
            class="form-control"
            id="name"
            formControlName="name"
            [ngClass]="{'is-invalid': submitted && f['name'].errors}"
            required
          />
          <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
            <div *ngIf="f['name'].errors['required']">Name is required</div>
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="parentCategoryId" class="form-label">Parent Category</label>
          <select
            class="form-select"
            id="parentCategoryId"
            formControlName="parentCategoryId"
          >
            <option [ngValue]="null">None</option>
            <option *ngFor="let category of categories" [value]="category.id">
              {{ category.name }}
            </option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea
          class="form-control"
          id="description"
          rows="3"
          formControlName="description"
        ></textarea>
      </div>

      <!-- Image Upload Section -->
      <div class="mb-3">
        <label class="form-label">Category Image</label>
        
        <!-- File Upload -->
        <div class="mb-2">
          <input
            type="file"
            class="form-control"
            id="imageFile"
            accept="image/*"
            (change)="onFileSelected($event)"
          />
          <div class="form-text">
            Supported formats: JPEG, PNG, GIF, WebP. Maximum size: 5MB
          </div>
        </div>

        <!-- OR Separator -->
        <div class="text-center my-2">
          <span class="text-muted">- OR -</span>
        </div>

        <!-- Image URL -->
        <div class="mb-2">
          <label for="imageUrl" class="form-label">Image URL</label>
          <input
            type="url"
            class="form-control"
            id="imageUrl"
            formControlName="imageUrl"
            placeholder="https://example.com/image.jpg"
            [disabled]="!!selectedFile"
          />
        </div>

        <!-- Image Preview -->
        <div *ngIf="hasImageToShow" class="mt-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label mb-0">Preview:</label>
            <button
              type="button"
              class="btn btn-sm btn-outline-danger"
              (click)="removeImage()"
              title="Remove Image"
            >
              <i class="fas fa-times"></i> Remove
            </button>
          </div>
          <div class="image-preview-container">
            <img 
              [src]="displayImageUrl" 
              alt="Category image preview" 
              class="img-thumbnail"
              style="max-width: 200px; max-height: 200px; object-fit: cover;"
            />
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="displayOrder" class="form-label">Display Order</label>
        <input
          type="number"
          class="form-control"
          id="displayOrder"
          formControlName="displayOrder"
          min="0"
        />
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>
